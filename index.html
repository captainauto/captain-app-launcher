<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>캡틴자동문</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="캡틴자동문">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2563eb">
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; text-align: center; color: #1f2937; background: #f5f7fa; }
  #landing { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 28px; }
  .top-half { display: flex; flex-direction: column; align-items: center; }
  .bottom-half { display: flex; flex-direction: column; align-items: center; padding: 0 20px; box-sizing: border-box; }
  .logo { width: min(350px, 70vw); height: min(350px, 70vw); object-fit: contain; margin-bottom: 8px; }
  h1 { font-size: 18px; margin: 0 0 24px; }
  .btn { display: inline-block; background: #2563eb; color: #fff; text-decoration: none; font-weight: 700; padding: 14px 28px; border-radius: 10px; font-size: 16px; border: none; font-family: inherit; cursor: pointer; }
  .hint { max-width: 360px; margin: 20px auto 0; text-align: left; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px 18px; font-size: 13px; color: #6b7280; line-height: 1.6; }
  .hint b { color: #1f2937; }
  #appFrame { display: none; position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .credit { margin: 0; font-size: 15px; color: #9ca3af; }
  .credit .sig { font-family: 'Great Vibes', cursive; font-size: 28px; color: #6b7280; margin-left: 4px; }
</style>
</head>
<body>
  <div id="landing">
    <div class="top-half">
      <img class="logo" src="logo.png" alt="캡틴자동문">
      <div class="credit">by <span class="sig">Seungwoo Kim</span></div>
    </div>
    <div class="bottom-half">
      <button class="btn" id="openBtn">지금 열기</button>
      <div class="hint">
        <b>홈 화면에 아이콘으로 추가하려면:</b><br>
        아이폰(Safari): 하단 공유 버튼 → "홈 화면에 추가"<br>
        안드로이드(Chrome): 우측 상단 메뉴(⋮) → "홈 화면에 추가"
        <br><br>
        한 번 추가해두면, 다음부터는 아이콘을 누르는 즉시 바로 앱으로 들어갑니다.
      </div>
    </div>
  </div>
  <iframe id="appFrame" title="캡틴자동문 관리자 대시보드"></iframe>
<script>
// script.google.com 주소로 최상위 이동(location.replace/직접 링크)하면 Google이 붙이는
// "Apps Script 사용자가 만들었습니다" 배너가 뜬다. 이 페이지(github.io) 안에서
// iframe으로만 열면 최상위 프레임이 계속 우리 도메인이라 배너가 표시되지 않는다.
var APP_URL = 'https://script.google.com/macros/s/AKfycby-npBgC32jFnKU74bx7gzFUBvuNctt8POBqBnWo9NsbfPuo6MjODDZ6dZvnBtwC9lf/exec';

// ── 빠른 주소(./app/, V56.16 속도 계획 4단계) ──────────────────────────
// 같은 화면을 GitHub Pages에서 받으면 구글 셸(매번 600KB, 캐시 안 됨)이 사라져 앱 뜨는 시간이 2.9초 → 0.9초(8/14 실측).
// 시범: 이 주소를 ?fast=1 로 한 번 열면 그 폰만 빠른 주소로, ?fast=0 이면 원래대로. 전원 전환은 FAST_DEFAULT를 true로.
var FAST_DEFAULT = false;
try {
  var fq = new URLSearchParams(location.search).get('fast');
  if (fq === '1') localStorage.setItem('useFastApp', '1');
  if (fq === '0') localStorage.setItem('useFastApp', '0');
} catch (e) {}
function useFastApp() {
  try {
    var v = localStorage.getItem('useFastApp');
    if (v === '1') return true;
    if (v === '0') return false;
  } catch (e) {}
  return FAST_DEFAULT;
}

// 원래 앱(iframe 안)이 로그인 정보를 건네주면 여기(github.io) 저장소에 둔다 — 같은 오리진인 ./app/이 그대로 읽어서
// 빠른 주소로 옮겨도 다시 로그인하지 않는다. 우리 iframe 안에서 온 메시지만 받는다(다른 창이 넣은 토큰은 무시).
function fromOurFrame(src) {
  var fw = document.getElementById('appFrame').contentWindow;
  try {
    for (var w = src, i = 0; w && i < 4; i++, w = w.parent) { if (w === fw) return true; if (w === w.parent) break; }
  } catch (e) {}
  return false;
}
window.addEventListener('message', function (e) {
  if (!/\.googleusercontent\.com$/.test(e.origin) || !fromOurFrame(e.source)) return;
  var d = e.data || {};
  try {
    if (d.type === 'captainLogin' && typeof d.authToken === 'string' && d.authToken && d.currentUser && d.currentUser.name) {
      localStorage.setItem('authToken', d.authToken);
      localStorage.setItem('currentUser', JSON.stringify(d.currentUser));
    } else if (d.type === 'captainLogout') {
      localStorage.removeItem('authToken');
      localStorage.removeItem('currentUser');
    }
  } catch (err) {}
});

function openApp() {
  if (useFastApp()) { location.replace('./app/'); return; }
  document.getElementById('landing').style.display = 'none';
  var frame = document.getElementById('appFrame');
  frame.style.display = 'block';
  frame.src = APP_URL;
}

document.getElementById('openBtn').addEventListener('click', openApp);

var isStandalone = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
if (isStandalone) {
  openApp();
}
</script>
</body>
</html>
