<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>지니 · 캡틴자동문</title>
<link rel="icon" type="image/png" href="../icon.png">
<!--
  캡틴자동문 앱의 음성 비서 "지니" 화면 (V57.0, 2026-10-21).
  왜 따로 있나: 앱 본 화면은 구글이 만든 틀(iframe) 안에서 도는데 그 틀이 마이크를 허용하지 않는다.
  이 화면은 github.io 최상위 창이라 브라우저 음성 인식(ko-KR)이 된다.
  로그인: 앱의 🎤 버튼으로 열면 앱이 토큰을 건네준다(postMessage). 바로 열면 이름·PIN으로 로그인.
  서버: 앱과 같은 doPost API(fn: jiniChat). 권한·지점은 서버가 로그인 역할로 정한다.
-->
<style>
  :root {
    --primary: #2563eb; --primary-dark: #1d4ed8; --bg: #f5f7fb; --card: #fff;
    --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --danger: #dc2626; --me: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: var(--card); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 18px; margin: 0; }
  header .who { font-size: 13px; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header button, header select {
    border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 14px; color: var(--text);
  }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; font-size: 16px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .msg.jini { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; background: none; color: var(--muted); font-size: 13px; padding: 2px; }
  .msg.err { align-self: center; color: var(--danger); background: #fef2f2; font-size: 14px; }
  .msg .replay { display: inline-block; margin-left: 6px; color: var(--muted); cursor: pointer; }
  #live { min-height: 22px; padding: 0 16px; color: var(--muted); font-size: 15px; text-align: center; }
  footer { background: var(--card); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .mic-row { display: flex; justify-content: center; margin-bottom: 10px; }
  #mic {
    width: 84px; height: 84px; border-radius: 50%; border: none; font-size: 36px;
    background: var(--primary); color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,.35);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none;
    transition: transform .1s, background .2s;
  }
  #mic.on { background: var(--danger); transform: scale(1.08); box-shadow: 0 0 0 10px rgba(220,38,38,.15); }
  #mic:disabled { background: #9ca3af; box-shadow: none; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .type-row { display: flex; gap: 8px; }
  .type-row input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
  .type-row button { padding: 10px 16px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 600; }
  #loginView { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .login-card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .login-card h2 { margin: 0 0 6px; font-size: 20px; }
  .login-card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .login-card input { width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; margin-bottom: 10px; }
  .login-card button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; }
  #loginMsg { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <header>
    <h1>🎤 지니</h1>
    <span class="who" id="who"></span>
    <select id="branchSel" class="hidden" aria-label="장부 지점"></select>
    <button id="ttsBtn" type="button" aria-label="소리로 읽기 켜기/끄기">🔊</button>
    <button id="newBtn" type="button">새 대화</button>
  </header>

  <div id="loginView" class="hidden">
    <form class="login-card" id="loginForm">
      <h2>지니 로그인</h2>
      <p>앱과 같은 이름·PIN으로 로그인하세요. 관리자만 쓸 수 있습니다.</p>
      <input id="loginName" placeholder="이름" autocomplete="username">
      <input id="loginPin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">
      <button type="submit">로그인</button>
      <div id="loginMsg"></div>
    </form>
  </div>

  <div id="chatView" class="hidden" style="flex:1;display:flex;flex-direction:column;min-height:0;">
    <div id="log" aria-live="polite"></div>
    <div id="live"></div>
    <footer>
      <div class="mic-row"><button id="mic" type="button" aria-label="누르고 말하기">🎤</button></div>
      <div class="hint" id="hint">누른 채로 말하고 손을 떼세요 · 짧게 누르면 다시 누를 때까지 듣습니다</div>
      <form class="type-row" id="typeForm">
        <input id="typeInput" placeholder="글자로 물어보기 (키보드 🎤도 됩니다)" autocomplete="off" enterkeyhint="send">
        <button type="submit">보내기</button>
      </form>
    </footer>
  </div>

<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycby-npBgC32jFnKU74bx7gzFUBvuNctt8POBqBnWo9NsbfPuo6MjODDZ6dZvnBtwC9lf/exec';
  // 앱 본 화면(구글 틀 안 = *-script.googleusercontent.com)이나 Pages 앱(/app/, 같은 오리진)만 토큰을 건넬 수 있다
  var OPENER_OK = /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/;
  var SELF_ORIGIN = location.origin;
  // 본사 관리자가 고를 수 있는 지점 — 서버 Code.js BRANCHES_(open)와 맞춘다. 서버가 최종으로 검사한다.
  var BRANCHES = [{ name: '본사', key: '' }, { name: '인천', key: '인천' }, { name: '남양주', key: '남양주' }];
  var AUTH_KEY = 'jiniAuth', TTS_KEY = 'jiniTts';

  var auth = null, sessionId = newSid(), busy = false;
  var $ = function (id) { return document.getElementById(id); };

  function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function newSid() { return 'j' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

  // ---------- 서버 ----------
  function api(fn, args) {
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 프리플라이트를 피해야 Apps Script가 받는다
      body: JSON.stringify({ branch: auth ? auth.branch || '' : '', fn: fn, args: args, token: auth ? auth.token : '' }),
      redirect: 'follow'
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || '알 수 없는 오류');
      return res.data;
    });
  }

  // ---------- 로그인 ----------
  function isAdmin(role) { return String(role || '').indexOf('관리자') !== -1; }

  function setAuth(a) {
    auth = a;
    store(AUTH_KEY, a ? JSON.stringify(a) : null);
    if (!a) { $('chatView').classList.add('hidden'); $('loginView').classList.remove('hidden'); $('who').textContent = ''; return; }
    $('loginView').classList.add('hidden'); $('chatView').classList.remove('hidden');
    var sel = $('branchSel');
    sel.classList.toggle('hidden', String(a.role).trim() !== '관리자');
    sel.innerHTML = BRANCHES.map(function (b) { return '<option value="' + b.key + '">' + b.name + '</option>'; }).join('');
    sel.value = a.branch || '';
    showWho();
  }
  function showWho() {
    var b = String(auth.role).trim() === '관리자' ? '' : ' · ' + (auth.branch || '본사');
    $('who').textContent = auth.name + ' (' + auth.role + ')' + b;
  }

  window.addEventListener('message', function (ev) {
    if (!(OPENER_OK.test(ev.origin) || ev.origin === SELF_ORIGIN)) return;
    var d = ev.data;
    if (!d || d.type !== 'jini-auth' || !d.token || !isAdmin(d.role)) return;
    var changed = !auth || auth.token !== d.token || auth.branch !== (d.branch || '');
    setAuth({ token: d.token, name: d.name, role: d.role, branch: d.branch || '' });
    if (changed) startNew(true);
  });

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('loginName').value.trim(), pin = $('loginPin').value.trim();
    if (!name || !pin) { $('loginMsg').textContent = '이름과 PIN을 넣어주세요.'; return; }
    $('loginMsg').textContent = '확인 중…';
    api('authenticate', [name, pin]).then(function (res) {
      if (!res || !res.success) { $('loginMsg').textContent = (res && res.message) || '이름 또는 PIN이 맞지 않습니다.'; return; }
      if (!isAdmin(res.role)) { $('loginMsg').textContent = '지니는 지금 관리자만 쓸 수 있습니다.'; return; }
      $('loginPin').value = ''; $('loginMsg').textContent = '';
      var m = String(res.role).trim().match(/^(.*)관리자$/);
      setAuth({ token: res.token, name: res.name, role: res.role, branch: m ? m[1].trim() : '' });
      startNew(true);
    }).catch(function (err) { $('loginMsg').textContent = err.message; });
  });

  // ---------- 대화 ----------
  function add(cls, text) {
    var el = document.createElement('div');
    el.className = 'msg ' + cls;
    el.textContent = text;
    if (cls === 'jini') {
      var r = document.createElement('span');
      r.className = 'replay'; r.textContent = '🔈'; r.title = '다시 듣기';
      r.addEventListener('click', function () { speak(text, true); });
      el.appendChild(r);
    }
    $('log').appendChild(el);
    $('log').scrollTop = $('log').scrollHeight;
    return el;
  }

  function startNew(greet) {
    sessionId = newSid();
    stopSpeak();
    $('log').innerHTML = '';
    if (greet) add('sys', '무엇이든 물어보세요. 예: "이번 달 미수금 얼마야?", "오늘 들어간 장부 읽어줘"');
  }

  function send(text) {
    text = String(text || '').trim();
    if (!text || busy || !auth) return;
    busy = true; setMicEnabled(false);
    add('me', text);
    var wait = add('sys', '지니가 찾아보는 중…');
    api('jiniChat', [sessionId, text]).then(function (res) {
      wait.remove();
      if (res.reset) add('sys', '대화가 길어졌거나 지점·날짜가 바뀌어 새로 시작했어요.');
      add('jini', res.text);
      speak(res.text);
    }).catch(function (err) {
      wait.remove();
      var m = err.message || String(err);
      if (/로그인이 만료됐거나 확인되지 않았습니다/.test(m)) { setAuth(null); $('loginMsg').textContent = '로그인이 만료됐습니다. 다시 로그인해주세요.'; return; }
      add('err', m);
      speak(m);
    }).then(function () { busy = false; setMicEnabled(true); });
  }

  $('typeForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('typeInput').value; $('typeInput').value = '';
    send(v);
  });
  $('newBtn').addEventListener('click', function () { startNew(true); });
  $('branchSel').addEventListener('change', function () {
    auth.branch = this.value; store(AUTH_KEY, JSON.stringify(auth)); showWho();
    startNew(false);
    add('sys', (auth.branch || '본사') + ' 장부로 바꿨어요.');
  });

  // ---------- 읽어주기 (speechSynthesis) ----------
  var ttsOn = load(TTS_KEY) !== 'off';
  var koVoice = null;
  function pickVoice() {
    if (!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices();
    koVoice = vs.filter(function (v) { return /^ko/i.test(v.lang); })[0] || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function renderTts() { $('ttsBtn').textContent = ttsOn ? '🔊' : '🔇'; }
  renderTts();
  $('ttsBtn').addEventListener('click', function () {
    ttsOn = !ttsOn; store(TTS_KEY, ttsOn ? 'on' : 'off'); renderTts();
    if (!ttsOn) stopSpeak();
  });
  function stopSpeak() { if (window.speechSynthesis) speechSynthesis.cancel(); }
  function speak(text, force) {
    if (!window.speechSynthesis || (!ttsOn && !force)) return;
    stopSpeak();
    var u = new SpeechSynthesisUtterance(String(text).replace(/[*#_`>|]/g, ' '));
    u.lang = 'ko-KR'; u.rate = 1.05;
    if (koVoice) u.voice = koVoice;
    speechSynthesis.speak(u);
  }
  // 아이폰은 사용자가 누른 순간에 한 번 말해둬야 이후의 비동기 읽기가 된다
  var ttsUnlocked = false;
  function unlockTts() {
    if (ttsUnlocked || !window.speechSynthesis) return;
    ttsUnlocked = true;
    var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u);
  }

  // ---------- 듣기 (Web Speech API) ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, finalText = '', interimText = '', pressAt = 0, toggleMode = false;

  /** 앞 결과를 포함한 새 결과면 바꿔 끼우고, 이미 들어 있는 조각이면 버리고, 새 말이면 이어 붙인다 */
  function mergeSpeech(acc, t) {
    var a = String(acc || '').trim(), b = String(t || '').trim();
    if (!b) return a;
    if (!a) return b;
    var na = a.replace(/\s+/g, ''), nb = b.replace(/\s+/g, '');
    if (nb.indexOf(na) === 0) return b;          // "인천점" 다음 "인천점 물건"
    if (na.indexOf(nb) !== -1) return a;          // 같은 말을 또 보냄
    return a + ' ' + b;                            // 정말 이어지는 새 말
  }

  function setMicEnabled(on) { $('mic').disabled = !on || !SR; }

  if (!SR) {
    $('mic').disabled = true;
    $('hint').textContent = '이 브라우저는 음성 인식이 안 됩니다. 크롬으로 열거나, 아래 칸에서 키보드의 🎤로 말해주세요.';
  }

  function startListen() {
    if (!SR || listening || busy) return;
    stopSpeak(); unlockTts();
    finalText = ''; interimText = '';
    rec = new SR();
    rec.lang = 'ko-KR'; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
    rec.onresult = function (ev) {
      // 매번 전체 결과를 다시 모은다. 안드로이드 크롬은 continuous 모드에서 "인천점" → "인천점 물건" →
      // "인천점 물건 중에"처럼 앞 내용을 포함한 결과를 따로따로 확정해 보내서, 그냥 이어 붙이면 말이 겹친다(10-21 실측).
      var f = '', it = '';
      for (var i = 0; i < ev.results.length; i++) {
        var t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) f = mergeSpeech(f, t); else it = mergeSpeech(it, t);
      }
      finalText = f; interimText = it;
      $('live').textContent = mergeSpeech(f, it);
    };
    rec.onerror = function (ev) {
      var m = {
        'not-allowed': '마이크 권한이 꺼져 있어요. 주소창의 자물쇠 → 마이크 허용을 눌러주세요.',
        'service-not-allowed': '이 브라우저에서 음성 인식을 쓸 수 없어요. 키보드의 🎤를 써주세요.',
        'no-speech': '말이 안 들렸어요. 다시 눌러 말해주세요.',
        'audio-capture': '마이크를 찾지 못했어요.',
        'network': '음성 인식 연결이 끊겼어요. 다시 해주세요.'
      }[ev.error];
      if (m) $('live').textContent = m;
    };
    rec.onend = function () {
      var said = mergeSpeech(finalText, interimText);
      listening = false; toggleMode = false; $('mic').classList.remove('on');
      if (said) { $('live').textContent = ''; send(said); }
    };
    try { rec.start(); listening = true; $('mic').classList.add('on'); $('live').textContent = '듣는 중…'; }
    catch (e) { $('live').textContent = '음성 인식을 시작하지 못했어요: ' + e.message; }
  }
  function stopListen() { if (rec && listening) { try { rec.stop(); } catch (e) {} } }

  var mic = $('mic');
  mic.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  mic.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (listening && toggleMode) { stopListen(); return; } // 짧게 눌러 켠 상태 → 한 번 더 누르면 끝
    pressAt = Date.now();
    startListen();
  });
  function release() {
    if (!listening || toggleMode) return;
    if (Date.now() - pressAt < 350) { toggleMode = true; $('live').textContent = '듣는 중… 다 말하면 한 번 더 누르세요'; return; }
    stopListen();
  }
  mic.addEventListener('pointerup', release);
  mic.addEventListener('pointercancel', release);

  // ---------- 시작 ----------
  try { auth = JSON.parse(load(AUTH_KEY) || 'null'); } catch (e) { auth = null; }
  if (auth && auth.token) { setAuth(auth); startNew(true); }
  if (window.opener) {
    // 앱 🎤 버튼으로 열렸다 — 앱에 토큰을 달라고 한다(비밀은 앱이 이 오리진으로만 보낸다)
    try { window.opener.postMessage({ type: 'jini-ready' }, '*'); } catch (e) {}
  }
  // 앱이 답을 안 주고 저장된 로그인도 없으면 로그인 화면
  setTimeout(function () { if (!auth) setAuth(null); }, window.opener ? 2500 : 0);
})();
</script>
</body>
</html>
